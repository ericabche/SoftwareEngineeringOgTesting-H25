<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      async function loginUser(event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        try {
          const res = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await res.text();
          document.getElementById("result").innerText = data;
        } catch (err) {
          document.getElementById("result").innerText = "Feil ved login";
          console.error(err);
        }
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h2>Login</h2>
      <form onsubmit="loginUser(event)">
        <label>Brukernavn:</label><br />
        <input id="username" type="text" required /><br /><br />

        <label>Passord:</label><br />
        <input id="password" type="password" required /><br /><br />

        <button type="submit">Login</button>
      </form>

      <p id="result" style="color: red"></p>

      <a href="register.html">Registrer ny bruker</a>
    </div>
  </body>
</html>
