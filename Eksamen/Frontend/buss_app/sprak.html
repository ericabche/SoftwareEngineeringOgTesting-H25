<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Språk</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/innstillinger.css">
  <link rel="stylesheet" href="ikoner/css/all.min.css">
</head>
<body class="page-language">

  <!-- APPBAR -->
  <header class="appbar" role="banner" aria-label="Toppmeny">
        <button
        class="appbar__back"
        onclick="history.back()"
        aria-label="Tilbake"
      >
        <i class="fa-solid fa-chevron-left"></i>
      </button>

    <h1 class="appbar__title" data-i18n="settings.language_label">
      Språk
    </h1>
    
    <span class="appbar__spacer" aria-hidden="true"></span>
  </header>

  <main class="container">
    <section class="settings-group" aria-labelledby="language-title">
      <h2
        id="language-title"
        class="group-title visually-hidden"
        data-i18n="settings.language_label"
      >
        Språk
      </h2>

      <ul class="lang-list">
        <li>
          <button class="lang-btn" data-lang="nb">
            <span>Norsk Bokmål</span>
            <i class="fa-regular fa-circle-check checkmark"></i>
          </button>
        </li>

        <li>
          <button class="lang-btn" data-lang="en">
            <span>English</span>
            <i class="fa-regular fa-circle-check checkmark"></i>
          </button>
        </li>
      </ul>

    </section>
  </main>

  <!-- BUNNMENY -->
  <nav class="navbar" aria-label="Hovedmeny">
    <a href="reise.html">
      <i class="fa-solid fa-bus" aria-hidden="true"></i>
      <span data-i18n="nav.travel">Reise</span>
    </a>

    <a href="billett.html">
      <i class="fa-solid fa-ticket" aria-hidden="true"></i>
      <span data-i18n="nav.ticket">Billett</span>
    </a>

    <a href="profil.html" class="active">
      <i class="fa-solid fa-user" aria-hidden="true"></i>
      <span data-i18n="nav.profile">Profil</span>
    </a>
  </nav>

  <!-- SCRIPT -->
  <script src="js/lang.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/lang-select.js"></script>
</body>
</html>
