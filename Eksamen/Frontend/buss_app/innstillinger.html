<!doctype html>
<html lang="nb">

    </p>

    <!-- ===== SEKSJON 1: APP-INNSTILLINGER ===== -->
    <section class="settings-group" aria-labelledby="settings-app-title">
      <h2

        Appinnstillinger
      </h2>

      <ul class="list list--grouped">
        <li>
          <a href="#" class="list-item">
            <span class="label" data-i18n="settings.notifications">

            </span>
          </a>
        </li>
        <li>
          <a href="#" class="list-item">
            <span class="label" data-i18n="settings.realtime_updates">

            </span>
          </a>
        </li>
        
        <li>
          <a href="sprak.html" class="list-item">
            <span class="label" data-i18n="settings.language_label">
              Språk
            </span>
            <span
              class="meta"
              id="current-language"
              data-i18n="settings.language_value"

              Norsk Bokmål
            </span>
          </a>
        </li>
              </ul>
            </section>

      <h2

        <li>

            <span class="label" data-i18n="settings.extra_transfer_time_label">

            <span class="meta" data-i18n="settings.extra_transfer_time_value">

          </a>
        </li>
