<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="heading_get_ticket">Hent billett</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profil.css">
  <link rel="stylesheet" href="ikoner/css/all.min.css">
</head>

<body class="page page--pickup">

  <!-- Appbar -->
  <header class="appbar appbar--center" role="banner">
    <a href="profil.html"
       class="backlink"
       data-i18n="settings.backlink">
      Profil
    </a>

    <h1 class="appbar__title" data-i18n="heading_get_ticket">
      Hent billett
    </h1>
  </header>

  <main id="main" class="container" tabindex="-1">

    <!-- Hentekode-skjema -->
    <form class="pickup-form" novalidate>
      <fieldset>
        <legend class="form-legend" data-i18n="ticket.enter_code">
          Oppgi hentekode
        </legend>

        <div class="code-inputs" aria-describedby="code-help">

          <label class="visually-hidden" for="code1" data-i18n="ticket.code_part1">
            Første del
          </label>
          <input
            id="code1"
            type="text"
            inputmode="text"
            pattern="[A-Za-z0-9]{2}"
            maxlength="2"
            required>

          <span aria-hidden="true" class="dash">-</span>

          <label class="visually-hidden" for="code2" data-i18n="ticket.code_part2">
            Andre del
          </label>
          <input
            id="code2"
            type="text"
            inputmode="text"
            pattern="[A-Za-z0-9]{2}"
            maxlength="2"
            required>

          <span aria-hidden="true" class="dash">-</span>

          <label class="visually-hidden" for="code3" data-i18n="ticket.code_part3">
            Tredje del
          </label>
          <input
            id="code3"
            type="text"
            inputmode="text"
            pattern="[A-Za-z0-9]{3}"
            maxlength="3"
            required>

          <button type="button"
                  class="clear"
                  aria-label="Tøm kode"
                  data-i18n-aria="ticket.clear_code">
            ×
          </button>
        </div>

        <p id="code-help"
           class="helptext"
           data-i18n="ticket.example">
          Eksempel: F4-R5-6O7
        </p>
      </fieldset>

      <button type="submit"
              class="btn btn--primary"
              disabled
              data-i18n="heading_get_ticket">
        Hent billett
      </button>
    </form>

    <!-- Kontaktinfo -->
    <section class="contact">
      <h2 class="visually-hidden" data-i18n="help_section_contact">
        Kontakt
      </h2>
      <p data-i18n="ticket.contact_text">
        Ved problemer ta kontakt med
        <a href="#" rel="nofollow">
          Østfold kollektivtrafikk kundesenter på 69&nbsp;12&nbsp;54&nbsp;80
        </a>.
      </p>
    </section>

  </main>

  <!-- Bunnmeny -->
  <nav class="navbar" aria-label="Hovedmeny">
    <a href="reise.html">
      <i class="fa-solid fa-bus"></i>
      <span data-i18n="nav.travel">Reise</span>
    </a>

    <a href="billett.html">
      <i class="fa-solid fa-ticket"></i>
      <span data-i18n="nav.ticket">Billett</span>
    </a>

    <a href="profil.html" class="active">
      <i class="fa-solid fa-user"></i>
      <span data-i18n="nav.profile">Profil</span>
    </a>
  </nav>

  <script src="js/lang.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
