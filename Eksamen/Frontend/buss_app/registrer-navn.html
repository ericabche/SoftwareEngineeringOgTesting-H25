<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="heading_register">Profiloppretting – Navn</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/registrer.css">
  <link rel="stylesheet" href="ikoner/css/all.min.css">
</head>
<body class="page-register">

  <!-- Appbar -->
  <header class="appbar" role="banner" aria-label="Toppmeny">
    <a href="registrer-epost.html"
       class="backlink"
       data-i18n="global.back">
      Tilbake
    </a>
    <h1 class="appbar__title" data-i18n="heading_register">
      Profiloppretting
    </h1>
    <span class="appbar__spacer" aria-hidden="true"></span>
  </header>

  <main class="container">
    <section class="register-card" aria-labelledby="step3-title">
      <h2 id="step3-title"
          class="question"
          data-i18n="register.name_question">
        Hva heter du?
      </h2>

      <div class="field">
        <label for="firstName"
               class="visually-hidden"
               data-i18n="register.first_name_label">
          Fornavn
        </label>
        <input
          id="firstName"
          name="firstName"
          type="text"
          autocomplete="given-name"
          placeholder="Fornavn"
          data-i18n-placeholder="register.first_name_label"
        />
      </div>

      <div class="field">
        <label for="lastName"
               class="visually-hidden"
               data-i18n="register.last_name_label">
          Etternavn
        </label>
        <input
          id="lastName"
          name="lastName"
          type="text"
          autocomplete="family-name"
          placeholder="Etternavn"
          data-i18n-placeholder="register.last_name_label"
        />
      </div>

      <p id="name-error" class="error-text" role="alert" hidden></p>

      <a href="profil.html"
         id="btn-save-profile"
         class="btn btn--primary btn--block register-btn btn--disabled"
         aria-disabled="true"
         data-i18n="global.save">
        Lagre
      </a>
    </section>
  </main>

  <!-- Bunnmeny -->
  <nav class="navbar" aria-label="Hovedmeny">
    <a href="reise.html">
      <i class="fa-solid fa-bus" aria-hidden="true"></i>
      <span data-i18n="nav.travel">Reise</span>
    </a>
    <a href="billett.html">
      <i class="fa-solid fa-ticket" aria-hidden="true"></i>
      <span data-i18n="nav.ticket">Billett</span>
    </a>
    <a href="profil.html" class="active" aria-current="page">
      <i class="fa-solid fa-user" aria-hidden="true"></i>
      <span data-i18n="nav.profile">Profil</span>
    </a>
  </nav>

  <!-- SCRIPT -->
  <script src="js/lang.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
