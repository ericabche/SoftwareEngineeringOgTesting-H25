<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="heading_forgot_password">Glemt passord</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="ikoner/css/all.min.css">
</head>
<body class="page-forgot">

  <!-- Appbar -->
  <header class="appbar" role="banner" aria-label="Toppmeny">
    <a href="login.html"
       class="backlink"
       data-i18n="global.back">
      Tilbake
    </a>
    <h1 class="appbar__title" data-i18n="heading_forgot_password">
      Glemt passord
    </h1>
    <span class="appbar__spacer" aria-hidden="true"></span>
  </header>

  <main class="container">
    <section class="login-card" aria-labelledby="forgot-title">
      <h2 id="forgot-title"
          class="login-title"
          data-i18n="forgot.title">
        Tilbakestill passord
      </h2>

      <p class="login-text" data-i18n="forgot.text">
        Skriv inn e-postadressen din, så sender vi deg en lenke for å tilbakestille passordet.
      </p>

      <!-- Info / feilmelding – kan toggles med JS -->
      <p class="info-message"
         role="status"
         hidden
         data-i18n="forgot.info">
        Hvis e-postadressen finnes hos oss, sender vi en tilbakestillingslenke om kort tid.
      </p>

      <form action="#" method="post" class="login-form" novalidate>
        <div class="field">
          <label for="email"
                 class="field-label"
                 data-i18n="forgot.email_label">
            E-post
          </label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </div>

        <button type="submit"
                class="btn btn--primary btn--block"
                data-i18n="forgot.submit">
          Send tilbakestillingslenke
        </button>
      </form>

      <p class="login-footer">
        <span data-i18n="forgot.remember">
          Husk passordet likevel?
        </span>
        <a href="login.html" class="link-strong" data-i18n="heading_login">
          Logg inn
        </a>
      </p>
    </section>
  </main>

  <!-- Bunnmeny -->
  <nav class="navbar" aria-label="Hovedmeny">
    <a href="reise.html">
      <i class="fa-solid fa-bus"></i>
      <span data-i18n="nav.travel">Reise</span>
    </a>

    <a href="billett.html">
      <i class="fa-solid fa-ticket"></i>
      <span data-i18n="nav.ticket">Billett</span>
    </a>

    <a href="profil.html" class="active">
      <i class="fa-solid fa-user"></i>
      <span data-i18n="nav.profile">Profil</span>
    </a>
  </nav>

  <script src="js/lang.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
